<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيكن تشيكن | Kickin Chicken</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lalezar&display=swap">
<style>
:root{--r:#E30613;--o:#F08000;--k:#000;--w:#fff;--soft:#fff3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--k);color:var(--w);line-height:1.7}
h1,h2,h3{font-family:Lalezar,Cairo,sans-serif;font-weight:400;margin:0;line-height:1.25}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
section{padding:56px 0}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 26px;font-size:1.05rem;font-weight:700;text-decoration:none;background:var(--r);color:var(--w)}
.btn.o{background:transparent;border:2px solid var(--o);color:var(--o)}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;max-width:1000px;margin:0 auto}
nav b{font-family:Lalezar;font-size:1.5rem;color:var(--o)}
nav a{color:var(--w);text-decoration:none;margin-inline-start:16px;font-weight:700}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;padding:24px 0 56px}
.hero img{width:100%;max-width:340px;justify-self:center}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem)}
.hero p{color:var(--o);font-size:1.2rem;font-weight:700;margin:12px 0 24px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.light{background:var(--w);color:var(--k)}
.light h2,.dark h2{font-size:2.2rem;margin-bottom:24px;color:var(--r)}
.dark h2{color:var(--o)}
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px}
.tabs button{flex:none;border:3px solid var(--k);background:var(--w);color:var(--k);border-radius:999px;padding:6px 20px;font-weight:700;font-size:1rem}
.tabs button[aria-pressed=true]{background:var(--o);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{border:3px solid var(--k);border-radius:16px;padding:16px;box-shadow:5px 5px 0 var(--o);display:flex;flex-direction:column;gap:6px;background:var(--w)}
.card .pic{height:180px;border-radius:12px;background:var(--soft);overflow:hidden}.card .pic.lg{background:#000}.card .pic.lg img{object-fit:contain;padding:14px}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:1.4rem}
.card p{margin:0;color:#444;font-size:.92rem;flex:1}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{font-weight:900;color:var(--r);font-size:1.15rem}
.add{background:var(--r);color:var(--w);border:0;border-radius:10px;padding:8px 18px;font-weight:700}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border-radius:50%;border:2px solid var(--k);background:var(--w);font-size:1.2rem;font-weight:900}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.rev div{border:2px solid var(--o);border-radius:16px;padding:18px}
.rev .st{color:var(--o);letter-spacing:2px}
.rev small{color:#bbb}
.br{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.br div{border:3px solid var(--k);border-radius:16px;padding:18px;box-shadow:5px 5px 0 var(--r)}
.br h3{color:var(--r);font-size:1.4rem}
.br a,.ct a{color:var(--r);font-weight:700}
.ct{display:flex;flex-wrap:wrap;gap:14px}
.ct a{display:block;color:var(--w);background:var(--r);padding:12px 22px;border-radius:12px;text-decoration:none}
.ct a.wa{background:var(--o);color:var(--k)}
footer{text-align:center;padding:22px;color:#aaa;font-size:.9rem}
#bar{position:fixed;inset-inline:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--r);display:none;z-index:5}
#bar button{width:100%;max-width:600px;display:flex;justify-content:space-between;margin:0 auto;background:var(--w);color:var(--k);border:0;border-radius:12px;padding:12px 20px;font-weight:900;font-size:1.05rem}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:9;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--w);color:var(--k);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ddd}
.tot{display:flex;justify-content:space-between;font-weight:900;padding:6px 0}
#sheet input,#sheet textarea{width:100%;margin:6px 0;padding:10px;border:2px solid var(--k);border-radius:10px;font:inherit}
.x{float:left;background:none;border:0;font-size:1.6rem}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.hero .acts{justify-content:center}.hero img{order:-1;max-width:240px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

const IMG={'وجبة ٢ قطعة':I.fried,'وجبة ٣ قطع':I.fried,'وجبة ٤ قطع':I.fried,'وجبة ٨ قطع':I.box,'وجبة ١٢ قطعة':I.box,
 'تشيكن كلاسيك':I.classic,'تشيكن بيكون':I.bacon,'تشيكن بووم':I.boom,'صوص سويت شيلي':I.dip};
M.forEach(x=>x.img=IMG[x.n]);
/* ====================================== */
const LOGO=document.querySelector('.hero img').src,$=id=>document.getElementById(id),cart={};let cat=M[0].c;
const cats=[...new Set(M.map(x=>x.c))];
const money=v=>v+' ج.م';
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>M.reduce((s,x)=>s+(cart[x.id]||0)*x.p,0);
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];draw()}
function draw(){
 $('tabs').innerHTML=cats.map(c=>`<button aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join('');
 $('items').innerHTML=M.filter(x=>x.c==cat).map(x=>{
  const q=cart[x.id]||0;
  return `<div class="card"><div class="pic${x.img?'':' lg'}"><img src="${x.img||LOGO}" alt="${x.n}"></div><h3>${x.n}</h3><p>${x.d}</p>
  <div class="row"><span class="price">${money(x.p)}</span>${q?`<span class="step"><button data-i="${x.id}" data-d="1" aria-label="زيادة">+</button><b>${q}</b><button data-i="${x.id}" data-d="-1" aria-label="نقص">−</button></span>`:`<button class="add" data-i="${x.id}" data-d="1">أضف</button>`}</div></div>`}).join('');
 const n=count();
 $('bar').style.display=n?'block':'none';
 $('open').innerHTML=`<span>عرض الطلب (${n})</span><span>${money(sub())}</span>`;
 $('lines').innerHTML=M.filter(x=>cart[x.id]).map(x=>`<div class="line"><span>${x.n}</span><span class="step"><button data-i="${x.id}" data-d="1">+</button><b>${cart[x.id]}</b><button data-i="${x.id}" data-d="-1">−</button></span><b>${money(cart[x.id]*x.p)}</b></div>`).join('');
 $('feerow').style.display=C.fee?'flex':'none';$('fee').textContent=money(C.fee);$('sum').textContent=money(sub()+C.fee);
 if(!n)$('sheet').classList.remove('on');
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.c){cat=t.dataset.c;draw()}
 if(t.dataset.i)change(+t.dataset.i,+t.dataset.d);
});
$('open').onclick=()=>$('sheet').classList.add('on');
$('close').onclick=()=>$('sheet').classList.remove('on');
$('send').onclick=()=>{
 const nm=$('nm').value.trim(),ph=$('ph').value.trim(),ad=$('ad').value.trim();
 if(!nm||!ph||!ad){$('err').textContent='اكتب الاسم والموبايل والعنوان.';return}
 $('err').textContent='';
 const L=['طلب جديد من موقع '+C.name,'',...M.filter(x=>cart[x.id]).map(x=>`• ${x.n} × ${cart[x.id]} = ${money(cart[x.id]*x.p)}`),'',
  ...(C.fee?['التوصيل: '+money(C.fee)]:['(سعر التوصيل حسب المنطقة)']),'الإجمالي: '+money(sub()+C.fee),'','الاسم: '+nm,'الموبايل: '+ph,'العنوان: '+ad];
 const u='https://wa.me/'+C.wa+'?text='+encodeURIComponent(L.join('\n'));
 window.open(u,'_blank')||(location.href=u);
};
$('rev').innerHTML=C.reviews.map(r=>`<div><div class="st">★★★★★</div><p>${r.t}</p><small>${r.n}</small></div>`).join('');
$('br').innerHTML=C.branches.map(b=>`<div><h3>${b.n}</h3><p>${b.a}</p><a href="${b.u||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.q)}" target="_blank" rel="noopener">افتح الخريطة</a></div>`).join('');
$('hrs').textContent=C.hours;if(!C.reviews.length)$('revsec').style.display='none';if(!C.hours)$('hrs').style.display='none';
$('ct').innerHTML=`<a href="tel:${C.phone}">اتصل: ${C.phone}</a><a href="tel:${C.phone2}">اتصل: ${C.phone2}</a><a class="wa" href="https://wa.me/${C.wa}" target="_blank" rel="noopener">كلمنا واتساب</a>`;
draw();
</script>
